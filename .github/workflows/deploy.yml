name: Deploy قرآن بدون نت to Google Play

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Essential Tools
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Build Web and Android
        run: |
          mkdir -p www
          cp index.html www/
          
          # إنشاء ملف التكوين الأساسي لـ Capacitor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.qatan.quranoffline",
            "appName": "قرآن بدون نت",
            "webDir": "www"
          }
          EOF
          
          npx cap add android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          npx cap copy
          npx cap sync android

      - name: 🔐 تأمين مسار ملف المفتاح الأصلي
        run: |
          # نسخ ملف المفتاح الموجود في جذر المستودع إلى المسار الداخلي للأندرويد
          if [ -f "${{ github.workspace }}/quran_final.keystore" ]; then
            cp "${{ github.workspace }}/quran_final.keystore" android/app/quran_final.keystore
            echo "✅ تم العثور على ملف المفتاح في المستودع ونقله بنجاح!"
          else
            echo "❌ خطأ: ملف quran_final.keystore غير موجود في جذر المستودع!"
            exit 1
          fi

      - name: 💥 الحقن الصارم لـ SDK 34 في كود المصدر
        run: |
          # 1. إجبار ملف variables.gradle على احتواء القيم الصحيحة
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 22
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxResourceInspectionVersion = '1.0.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF

          # 2. استبدال المتغيرات بنصوص برمجية ثابتة (Hardcoded) داخل ملف build.gradle الرئيسي للتطبيق
          sed -i 's/rootProject.ext.compileSdkVersion/34/g' android/app/build.gradle
          sed -i 's/rootProject.ext.targetSdkVersion/34/g' android/app/build.gradle
          sed -i 's/rootProject.ext.minSdkVersion/22/g' android/app/build.gradle

          # 3. تعديل ملف الـ Manifest الرئيسي للتطبيق لفرض الـ SDK صراحة عبر الـ XML
          # سنقوم بحقن وسم uses-sdk بشكل صحيح كأول عنصر داخل <manifest>
          sed -i 's|<manifest[^>]*>|&\n    <uses-sdk android:minSdkVersion="22" android:targetSdkVersion="34" />|g' android/app/src/main/AndroidManifest.xml

          echo "=== تمت عملية الحقن والتهيئة الصارمة لملف الـ Manifest والـ Gradle ==="

      - name: Build and Sign Android App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/quran_final.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="quran_alias" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.build.compileSdkVersion=34 \
            -Pandroid.injected.build.targetSdkVersion=34 \
            -Pandroid.injected.build.minSdkVersion=22

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: "com.qatan.quranoffline"
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
