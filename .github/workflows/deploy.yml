name: Deploy قرآن بدون نت to Google Play

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Essential Tools
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Build Web and Android
        run: |
          mkdir -p www
          cp index.html www/
          npx cap init "قرآن بدون نت" "com.qatan.quranoffline" --web-dir www
          npx cap add android
          
          # نقل ملف المفتاح المرفوع إلى داخل مجلد أندرويد
          cp quran_final.keystore android/
          
          # تبديل الأيقونات
          rm -rf android/app/src/main/res/mipmap-*
          mkdir -p android/app/src/main/res/mipmap-hdpi
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-mdpi && cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xhdpi && cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xxhdpi && cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi && cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          npx cap copy
          npx cap sync android

      - name: Verify Keystore Integrity
        run: |
          keytool -list -v \
            -keystore android/quran_final.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Build and Sign Android App Bundle (AAB)
        run: |
          cd android
          
          # 🛑 هنا السر: مسح وإعادة كتابة المتغيرات بعد الـ Sync مباشرة وقبل بناء التطبيق بثوانٍ
          rm -f variables.gradle
          cat << 'EOF' > variables.gradle
          ext {
              minSdkVersion = 22
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxResourceInspectionVersion = '1.0.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF
          
          # تعديل مباشر وقاسٍ لملفات الـ build.gradle لضمان عدم قراءة رقم 1 نهائياً
          find . -name "build.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' {} +
          find . -name "build.gradle" -exec sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' {} +
          find . -name "build.gradle" -exec sed -i 's/compileSdk.*/compileSdk 34/g' {} +
          find . -name "build.gradle" -exec sed -i 's/targetSdk.*/targetSdk 34/g' {} +

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/quran_final.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="quran_alias" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: "com.qatan.quranoffline"
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal

