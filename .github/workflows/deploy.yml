name: Deploy قرآن بدون نت to Google Play

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Essential Tools
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Build Web and Android
        run: |
          mkdir -p www
          cp index.html www/
          
          # إنشاء ملف التكوين الأساسي لـ Capacitor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.qatan.quranoffline",
            "appName": "قرآن بدون نت",
            "webDir": "www"
          }
          EOF
          
          npx cap add android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          npx cap copy
          npx cap sync android

      - name: 🔐 نقل وتأمين ملف المفتاح من جذر المستودع
        run: |
          if [ -f "${{ github.workspace }}/quran_final.keystore" ]; then
            cp "${{ github.workspace }}/quran_final.keystore" android/app/quran_final.keystore
            echo "✅ تم نقل ملف المفتاح بنجاح!"
          else
            echo "❌ خطأ: لم يتم العثور على ملف quran_final.keystore في جذر المستودع!"
            exit 1
          fi

      - name: 💥 سحق وإجبار الـ SDK وإعادة كتابة الـ Manifest قسرياً
        run: |
          # 1. إعداد ملف variables.gradle
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 22
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxResourceInspectionVersion = '1.0.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF

          # 2. إنشاء ملف خصائص الأندرويد
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 3. إجبار المجلدات والمشاريع الفرعية على الامتثال المطلق للهدف رقم 34
          cat << 'EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 34
                          defaultConfig {
                              minSdkVersion 22
                              targetSdkVersion 34
                          }
                      }
                  }
              }
          }
          EOF

          # 4. حقن صارم للقيم داخل ملف build.gradle الخاص بالتطبيق
          cat << 'EOF' >> android/app/build.gradle
          android {
              compileSdkVersion 34
              defaultConfig {
                  minSdkVersion 22
                  targetSdkVersion 34
              }
          }
          EOF

          # 5. إعادة كتابة ملف الـ AndroidManifest.xml الرئيسي وضمان وجود الـ uses-sdk بداخل الهيكل نصاً رغماً عن أي دمج
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="com.qatan.quranoffline">

              <uses-sdk android:minSdkVersion="22" android:targetSdkVersion="34" tools:overrideLibrary="*" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.qatan.quranoffline.MainActivity"
                      android:label="@string/title_activity_main"
                      android:exported="true"
                      android:launchMode="singleTop">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>
          </manifest>
          EOF

          echo "=== تم سحق المشكلة وإعادة هيكلة الـ Manifest بنجاح ==="

      - name: Build and Sign Android App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/quran_final.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="quran_alias" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.build.compileSdkVersion=34 \
            -Pandroid.injected.build.targetSdkVersion=34 \
            -Pandroid.injected.build.minSdkVersion=22

      - name: 🕵️ تتبع الـ Manifest المدمج النهائي (Merged Manifest) بعد البناء وقبل الرفع
        run: |
          echo "=== التثبت من وجود وسم الـ SDK النهائي ==="
          find android/app/build/ -name "AndroidManifest.xml" -exec echo "--- ملف جديد: {} ---" \; -exec grep -Hn "targetSdkVersion" {} \; || true

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: "com.qatan.quranoffline"
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
