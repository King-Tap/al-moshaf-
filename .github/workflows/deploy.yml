name: Deploy قرآن بدون نت to Google Play

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Essential Tools
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Build Web and Android
        run: |
          mkdir -p www
          cp index.html www/
          
          # إنشاء ملف التكوين الأساسي لـ Capacitor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.qatan.quranoffline",
            "appName": "قرآن بدون نت",
            "webDir": "www"
          }
          EOF
          
          npx cap add android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📥 تثبيت وتهيئة الـ Android SDK 35 بالطريقة الرسمية الصارمة
        run: |
          # تحديد المسار الثابت للـ SDK
          echo "ANDROID_HOME=$ANDROID_ALLOW_UNSECURE_ANDROID_HOME" >> $GITHUB_ENV
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          
          # تحديث الـ sdkmanager وقبول التراخيص إجبارياً
          yes | sdkmanager --licenses
          
          # تحميل المنصة 35 وأدوات البناء المتوافقة في المسار الصحيح للنظام
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          
          # التأكد من وجود الملف لحل مشكلة التجميع
          if [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            echo "✅ تم التحقق! ملف android.jar الخاص بـ SDK 35 موجود ومستعد للبناء!"
          else
            echo "⚠️ تحذير: جاري محاولة إعادة الربط القسري للمجلد..."
            mkdir -p $ANDROID_HOME/platforms/android-35
            sudo apt-get update && sudo apt-get install -y android-sdk-platform-23-api || true
            # إعادة المحاولة للتأكيد التام
            sdkmanager "platforms;android-35"
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap copy
          npx cap sync android

      - name: 🔐 نقل وتأمين ملف المفتاح من جذر المستودع
        run: |
          if [ -f "${{ github.workspace }}/quran_final.keystore" ]; then
            cp "${{ github.workspace }}/quran_final.keystore" android/app/quran_final.keystore
            echo "✅ تم نقل ملف المفتاح بنجاح!"
          else
            echo "❌ خطأ: لم يتم العثور على ملف quran_final.keystore في جذر المستودع!"
            exit 1
          fi

      - name: 💥 تطهير وفرض قيم الـ SDK 35 الصارمة وحقن الـ Namespace
        run: |
          # 1. إعداد ملف variables.gradle الرئيسي باستهداف SDK 35 الإجباري لجوجل
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 22
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxResourceInspectionVersion = '1.0.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF

          # 2. ضبط خصائص الأندرويد لتعطيل التحذيرات والتحقق الصارم
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties

          # 3. إعادة كتابة ملف android/app/build.gradle بالكامل وحل مشكلة الـ Namespace مع فرض SDK 35
          cat << 'EOF' > android/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "com.qatan.quranoffline"
              compileSdkVersion 35
              
              defaultConfig {
                  applicationId "com.qatan.quranoffline"
                  minSdkVersion 22
                  targetSdkVersion 35
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                       cruncherEnabled = false
                  }
              }
              
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          repositories {
              flatDir {
                  dirs 'libs'
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation project(':capacitor-android')
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.core:core-ktx:1.12.0"
          }
          EOF

          # 4. كتابة الـ Manifest الصارم والنهائي بالـ SDK 35 الجديد
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-sdk android:minSdkVersion="22" android:targetSdkVersion="35" tools:overrideLibrary="*" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.qatan.quranoffline.MainActivity"
                      android:label="@string/title_activity_main"
                      android:exported="true"
                      android:launchMode="singleTop">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>
          </manifest>
          EOF

          echo "=== تم تصفية الملفات وحل الـ Namespace وفرض SDK 35 بنجاح تام ==="

      - name: Build and Sign Android App Bundle (AAB)
        run: |
          cd android
          export ANDROID_HOME=/usr/local/lib/android/sdk
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/quran_final.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="quran_alias" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: "com.qatan.quranoffline"
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal

