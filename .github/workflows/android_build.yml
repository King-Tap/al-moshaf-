name: Build Quran App APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor & Assets Tool
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          
      - name: Initialize App & Setup Icons
        run: |
          mkdir -p www
          cp index.html www/
          # مبادرة المشروع باسم الحزمة com.quran.offline
          npx cap init "QuranApp" "com.quran.offline" --web-dir www
          npx cap add android
          
          # الجزء الأهم: استبدال كافة الأيقونات المعقدة بصورتك مباشرة
          # هذا السطر يحل مشكلة الـ XML التي سببت أخطاء في التطبيقات الأخرى
          npx capacitor-assets generate --android --icon icon.png

      - name: Build Android APK
        run: |
          npx cap copy
          cd android && ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Offline-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
